*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;overflow:hidden}
.site{height:100vh;overflow-y:auto;overflow-x:hidden;position:relative;background:#000}
.bgcolor{position:fixed;inset:0;z-index:0;background:#000}
.bgimg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;display:none}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:transparent;z-index:0;display:none}
.overlay{position:fixed;inset:0;z-index:1;pointer-events:none}
.tabs{
  position:sticky;top:0;z-index:9;display:flex;gap:8px;overflow-x:auto;padding:12px 16px;
  background:rgba(0,0,0,.72);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.13)
}
.tab{
  appearance:none;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);
  padding:9px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;font-weight:700
}
.tab.active{background:#fff;color:#000}
.stage{
  position:relative;z-index:3;min-height:100vh;display:flex;justify-content:center;
  padding:7vh max(6vw,28px) 18vh
}
.inner{width:100%}
.title{
  color:#fff;line-height:1.02;font-weight:800;
  letter-spacing:-.04em;margin:0 0 32px
}
.copy{
  width:100%;line-height:1.52;overflow-wrap:anywhere
}
.copy img{max-width:100%;height:auto}
.copy a{color:inherit;text-decoration:underline}
.controls{
  position:fixed;right:14px;bottom:14px;z-index:20;display:flex;gap:7px;opacity:.22;transition:.2s
}
.controls:hover{opacity:1}
.controls button{
  border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.5);
  color:white;border-radius:999px;padding:8px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px
}
.control-icon{
  width:18px;
  height:18px;
  display:block;
  flex:0 0 auto;
  fill:currentColor;
}
.controls .reset-round{
  width:38px;
  height:38px;
  min-width:38px;
  padding:0;
  border-radius:50%;
  justify-content:center;
}
.reset-icon{transform:rotate(-90deg)}

le=\"font-size: 45px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">\u003c/span>\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 44px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 43px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 42px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 41px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 40px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">\u003c/span>\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 41px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 42px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 43px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 44px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 45px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">\u003c/span>\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 46px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 47px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 48px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 49px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 50px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">\u003c/span>\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 49px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 48px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 47px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">\u003c/span>\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 46px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 45px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 44px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 43px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 42px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 41px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 40px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 39px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 38px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 37px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 36px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 35px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 34px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 33px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 32px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 31px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 30px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">Siamo ammessi solo alla festa cr\u003c/span>\u003cspan style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">udele,\u003c/span>\u003cdiv>\u003cspan data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">una di quelle con angosciose candele,\u003cbr>festa antica per il festoso fedele.\u003cbr>Quando la tradizione sostituisce la festività\u003cbr>senza possibilità di una nuova attualità,\u003cbr>si sente solo la necessità\u003cbr>e la diversità\u003cbr>della festa dei diversi,\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 32px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 33px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 34px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 35px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 36px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 37px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 38px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 39px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 40px;\">\u003cbr>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>per cui si cerca di commuoversi&nbsp;\u003cbr>per farne una festa nostra,&nbsp;\u003cbr>come nell’osservare una danza\u003cbr>e di udir la musica nessuna speranza,\u003cbr>o perché si è perso l’udito\u003cbr>o in assenza oggettiva di musica,\u003cbr>non solo quella classica\u003cbr>e il tutto suona inaudito\u003cbr>e si va come si va a una mostra.\u003cbr>Rimangono solo sforzi come miraggi,&nbsp;\u003cbr>spiritati allunaggi\u003cbr>privi di storicità&nbsp;\u003cbr>per la nostra non più festosa collettività\u003cbr>tanta malinconia, un tempo giocondità.\u003cbr>“Festa in negativo”\u003cbr>“forma in cavo”\u003cbr>“di ciò che era la festa”\u003cbr>“della vera festa”\u003cbr>in cui il dolore la gioia spodesta,\u003cbr>diceva Furio Jesi,\u003cbr>inventando della macchina mitologica gli arnesi.\u003cbr>Niente più Paese di Cuccagna,\u003cbr>feste medievali con loro magna magna,\u003cbr>niente più feste dei folli\u003cbr>piene di spiedi, piene di polli,\u003cbr>comune evasione dalla realtà,\u003cbr>orgiastica eversione della civiltà,\u003cbr>lo dicono Max Horkheimer e Theodor W. Adorno,\u003cbr>ma non Mircea Eliade con i suoi Miti dell’Eterno ritorno.\u003cbr>Per Charles Baudelaire e Tonio Kröger&nbsp;\u003cbr>rimane solo una domestica hamburger in un lager,\u003cbr>festa interiore,\u003cbr>in cui il colore ha un altro colore\u003cbr>in contrasto col folklore\u003cbr>(istante tra i selvaggi e i civili\u003cbr>mentre non sono né virtuosi né vili).\u003cbr>Interiorizzazione, masticazione, incorporazione,\u003cbr>di un tempo astorico la narrazione\u003cbr>del narrante,&nbsp;\u003cbr>che introietta della festa la colazione\u003cbr>a base di crudités, crudità&nbsp;\u003cbr>dell’unica possibile collettiva crudeltà\u003cbr>del festeggiante.\u003cbr>“Coincidenza tra tempo storico presente”\u003cbr>“e attualità immobile astorica”\u003cbr>(tolta la festa ancora vera del 18° e la sua retorica)\u003cbr>che è il punto dell’esistenza operante&nbsp;\u003cbr>dell’odierno benandante.\u003cbr>Le feste pacifiche dei selvaggi\u003cbr>osservate da estrosi etnografi nei loro estrosi viaggi\u003cbr>altrove diversi mascherati da uguali,\u003cbr>importanti son le parvenze,\u003cbr>di cui l’etnologo spia le movenze,\u003cbr>(è possibile spiare di nascosto solo quelli ineguali).\u003cbr>“I selvaggi in festa raggiungono la massima densità”\u003cbr>“della loro diversità”\u003cbr>che è l’acme dell’umanità\u003cbr>e là si ha la possibilità&nbsp;\u003cbr>di un’altra solidarietà.\u003cbr>Per Thorstein Veblen la festa è un’azione\u003cbr>dove ostentano gli agiati della nazione\u003cbr>spreco vistoso,\u003cbr>tutto deve esser costoso,\u003cbr>che sia il potlatch nella Guinea Papua&nbsp;\u003cbr>o il ballo della nobiltà di Capua.\u003cbr>I calendari sono diversi dagli orologi,\u003cbr>questo scoprono alcuni sociologi\u003c/span>\u003c/div>\u003cdiv>\u003cspan data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">con gran scroscio di elogi.\u003cbr>Per Walter Benjamin è rappresentazione\u003cbr>dello spezzare del continuum temporale,\u003cbr>è la Rivoluzione,\u003cbr>che è tempo festivo corale,\u003cbr>violento temporale.\u003cbr>Dopo l’Illuminismo,\u003cbr>un nuovo deismo,\u003cbr>unica illuminazione\u003cbr>per tutti quelli dentro e fuori dalla patria prigione,\u003cbr>evviva le Feste della Dea Ragione\u003cbr>e dell’Essere Supremo, dannazione!\u003cbr>La Ragion di Stato\u003cbr>del borghese&nbsp;\u003c/span>\u003c/div>\u003cdiv>\u003cspan data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">sdogana la retorica dell'ultimo arrivato.\u003cbr>Per Elias Canetti è rilassamento\u003cbr>e concentrazione\u003cbr>di cose, beni e persone,\u003cbr>dove la sostanza coincide col momento\u003cbr>in cui le feste si richiamano l’altra l’una,\u003cbr>biglietto futuro per la prossima giostra della fortuna.\u003cbr>Eppur laboriosa,\u003cbr>labor labor labor\u003cbr>o non labor,\u003cbr>sì o no gioiosa,\u003cbr>sia che sia rifiuto del lavoro corruttore\u003cbr>sia celebrazione del dopo lavoro a tutte le ore.\u003cbr>Fatto sociale\u003cbr>totale,\u003cbr>è che la conoscibilità della festa nella società borghese&nbsp;\u003cbr>è per Jesi a farne le spese:\u003cbr>“non conosciamo le eventuali qualità positive&nbsp;\u003c/span>\u003c/div>\u003cdiv>\u003cspan data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">o negative di quelle feste”\u003cbr>“(che potevano anche essere nefaste)”\u003cbr>“ovvero la nostra non conoscenza della festa attuale”\u003cbr>“impedisce di dire se sia bene o male”\u003cbr>“dal punto di vista politico e sociale”.&nbsp;\u003cbr>Il germanista torinese&nbsp;\u003cbr>se per la festa la butta in Sangiovese&nbsp;\u003cbr>con fare comunque sinistrese\u003cbr>ne ha dette tante altre di pese\u003cbr>che ha appesantito il paese\u003cbr>(certa Intellettualitalia\u003cbr>ciuccia sempre da una cattiva balia).\u003cbr>Poteva continuare a far parlare le pietre\u003cbr>di cui aveva carpito segreti custoditi in segrete\u003cbr>o della ceramica greca dell’età tinita\u003cbr>su cui puoi passarci a studiare una vita.\u003cbr>Già con il saggio “Bachofen e la ginecocrazia”\u003cbr>pone le basi perché odi scientemente pure la zia\u003c/span>\u003c/div>\u003cdiv>\u003cspan data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">Aralda di burocrazia.\u003c/span>\u003c/div>\u003cdiv>\u003cspan data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">Summa summarum è sempre la stessa storia\u003cbr>della macchina mitologica,\u003cbr>la sua idiosincratica logica\u003cbr>con cui spiegare l’ideologizzazione\u003cbr>degli altri.&nbsp;\u003cbr>Sempre la stessa boria\u003cbr>reazionaria la sua\u003cbr>ossessione per la Nazione\u003cbr>degli scaltri.&nbsp;\u003c/span>\u003c/div>\u003cdiv>\u003cspan data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">Germanizzazione:\u003cbr>imputava\u003cbr>a quel che lui sentiva&nbsp;\u003cbr>avversario politico,\u003cbr>incursioni nel territorio mitico,&nbsp;\u003cbr>dove la mente arcaica\u003cbr>metteva ordine, gerarchia, origine sacra,\u003cbr>alla faccia della critica prosaica\u003cbr>che lui tanto ama mentre il resto esecra.\u003cbr>Cultura di Destra furiosa,\u003cbr>spartanamente manesca e maldestra è la chiosa,\u003cbr>violenta, nostalgica, sacrificale,\u003cbr>vede nel mito verità atemporale,\u003cbr>guida morale&nbsp;\u003cbr>Al Di Là Del Bene E Del Male,&nbsp;\u003cbr>A D L D B E D M -\u003c/span>\u003c/div>\u003cdiv>\u003cspan data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">la linea emme, tutto un bailamme,\u003c/span>\u003c/div>\u003cdiv>\u003cspan data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">Mazzini, Marx, Mao, Min, Marcuse,\u003c/span>\u003c/div>\u003cdiv>\u003cspan data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">serve un lanciafiamme o lanciargli le gemme,\u003c/span>\u003c/div>\u003cdiv>\u003cspan data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">(questi i concordi balordi di Blanciardi)\u003c/span>\u003c/div>\u003cdiv>\u003cspan data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">Mussolini non c'è ma porge le scuse,\u003cbr>cosa che da buon barbuto sbarbino,\u003cbr>l’enfant prodige,\u003cbr>bolla come perversità\u003cbr>(cherchez la femme,&nbsp;\u003c/span>\u003c/div>\u003cdiv>\u003cspan data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">che molto probabilmente non c'è,\u003c/span>\u003c/div>\u003cdiv>\u003cspan data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">di fatto lui era un proto-incel)\u003cbr>e nel suo Libro Nero tale redige\u003cbr>per far contento Gesù bambino.\u003c/span>\u003c/div>\u003cdiv>\u003cspan data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">Un cr.puntino.o è un cr.puntino.o &nbsp;\u003c/span>\u003c/div>\u003cdiv>\u003cspan data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">è un cr.puntino.o è un cr.puntino.o.\u003c/span>\u003c/div>\u003cdiv>\u003cspan data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">\u003cbr>\u003c/span>\u003c/div>\u003cdiv>\u003cspan data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">\u003cbr>\u003c/span>\u003c/div>\u003cdiv>\u003cspan data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 46px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 45px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 44px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 43px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 42px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 41px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 40px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 39px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 38px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 37px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 36px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 35px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 34px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 33px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 32px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 31px;\">\u003cspan data-sacrisoft-style=\"1\" st -style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">ovvero in Francia&nbsp;casalinga -&nbsp;\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cdiv>\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cspan data-sacrisoft-style=\"1\">\u003cdiv style=\"font-size: 30px;\">in francese carnale - tutt'altra lingua,\u003cbr>\ndicitura per indicare la clausura,\u003cbr>\nitalicamente spirituale,\u003cbr>cardinale del mio paese\u003cbr>\nmorto d’amor troppo cortese, palese,\u003cbr>\npretese, offese, intese, amorose-militari rese,\u003cbr>\nfin’amor borghese.\u003cbr>\nCatherine, Grillet, Millet, Bidet,\u003cbr>\ngli amor profani eccitano&nbsp;\u003cbr>\nil trovatore occitano.\u003cbr>\nNanà à la Zolà, diabolica, voilà\u003c/div>\u003cdiv style=\"font-size: 30px;\">ma jolie Angelinà\u003cbr>\nverso Angelica da Salina,&nbsp;\u003c/div>\u003cdiv style=\"font-size: 30px;\">Lampedusa gattopardesca&nbsp;\u003c/div>\u003cdiv style=\"font-size: 30px;\">\ngattina\u003cbr>\nda morta dottrina,\u003cbr>furbesca fatina,\u003c/div>\u003cdiv style=\"font-size: 30px;\">fantastica fantina,\u003cbr>\u003c/div>\u003cdiv style=\"font-size: 30px;\">fantesca fa da esca,\u003c/div>\u003cdiv style=\"font-size: 30px;\">esca viva abbasso l'iva\u003c/div>\u003cdiv style=\"font-size: 30px;\">come han levato la leva,\u003c/div>\u003cdiv style=\"font-size: 30px;\">tolto, a ragione, obtorto,\u003c/div>\u003cdiv style=\"font-size: 30px;\">o torto, nazionale aborto,\u003c/div>\u003cdiv style=\"font-size: 30px;\">sconfort, sconforto,\u003c/div>\u003cdiv style=\"font-size: 30px;\">escort d’asporto,\u003c/div>\u003cdiv style=\"font-size: 30px;\">ti tel con gran trasporto.\u003cbr>\nDegli INCEL dominatrice,\u003cbr>\nMedusa, Aretusa,\u003cbr>\nBeatrice ,\u003cbr>\nbela tosa.\u003cbr>\nImmune a Bela Lugosi.\u003cbr>\n“Amor e ’l cor gentil sono una cosa”.\u003cbr>\nDa Dalle a Della Casa,\u003cbr>\ndove mi calza a rete, 5G\u003cbr>\ntu le sais, mon monsieur,&nbsp;\u003c/div>\u003cdiv style=\"font-size: 30px;\">invaghito di vaghi mie pregi,\u003cbr>\n- a maglie larghe - di manica larga\u003cbr>\nsono e spalle strette da terga,\u003c/div>\u003cdiv style=\"font-size: 30px;\">da scarsa seconda di tette a seconda a nessuno,\u003c/div>\u003cdiv style=\"font-size: 30px;\">piedino feticcio che lavi in un catino\u003c/div>\u003cdiv style=\"font-size: 30px;\">pian piano\u003cbr>\nho tutta la giornata in mano\u003cbr>\nmanovro in casa la mia routine dal mattino.\u003c/div>\u003cdiv style=\"font-size: 30px;\">\nNon in Comune come una velata,\u003cdiv>- l'Istituzione del Velo l'ha cooptata -,\u003cbr>\n\u003cem>Italia di ‘sti Comuni\u003c/em>,\u003cbr>\ncon cui non ho (più) niente in comune,\u003cbr>\nin casa sfoglio la Blavatsky,&nbsp;\u003c/div>\u003cdiv>Isis svelata,\u003cbr>\nper esprimermi in rune\u003c/div>\u003cdiv>e farmi beata\u003c/div>\u003cdiv>sulla federa tre gocce di whisky.\u003cbr>\nLa mia solitudine interiore\u003cbr>\nè solipsismo verbale,&nbsp;\u003c/div>\u003cdiv>controriforma asociale,\u003cbr>\nabbasso il culturame,&nbsp;\u003cbr>\nin alto il verdurame&nbsp;\u003c/div>\u003cdiv>più cult e vero-speranza,&nbsp;\u003cbr>\ninterior design idiosincratico, demotico,&nbsp;\u003cbr>\nviva la robotica&nbsp;\u003c/div>\u003cdiv>a pulire il cielo della stanza\u003cbr>\nin casa sto bene, pecco d'arroganza\u003c/div>\u003cdiv>di cui ho noncuranza, vivo in latitanza\u003c/div>\u003cdiv>come altri in vacanza,\u003c/div>\u003cdiv>YouTuberomanza, ci tengo alla distanza,\u003c/div>\u003cdiv>vesto shorts d'organza,\u003c/div>\u003cdiv>non sono abbastanza\u003c/div>\u003cdiv>\nuna femmina liberata,&nbsp;\u003cbr>\nuna femminista imparata,\u003cbr>\nsono per voi troppo fatale,&nbsp;\u003cbr>\nper questo sto a casa, per non farvi male,&nbsp;\u003cbr>\nper non farmi male, sono d’intenso candore,\u003cbr>\nsto bene in casa a tutte le ore,&nbsp;\u003c/div>\u003cdiv>più amare, più ardore,\u003cbr>\nagli imperativi so stare\u003c/div>\u003cdiv>e sottostare&nbsp;\u003c/div>\u003cdiv>al mio imperatore,\u003cbr>\namo molto di più se non devo uscire\u003cbr>\nper l’aperitivo, dolce servire&nbsp;\u003cbr>\nil dolce stilnovo con l’uovo\u003cbr>\nsebbene non mi piaccia, preferisco il salato,&nbsp;\u003cbr>\nma volentieri ti servo il tuo gelato,\u003cbr>\nbagnato, con lingue di gatto, abolite dal ’68,\u003cbr>\nbollite!\u003cbr>\nSono d’interiori,&nbsp;\u003cbr>\nmi alzo e mi corico senza andare fuori\u003cbr>\n(forse mi perdo d’oggi forsennati furori),\u003cbr>fintanto alpeggio&nbsp;\u003c/div>\u003cdiv>nella mia malga, ho tanto di quel foraggio\u003cbr>\nche ti posso foraggiare da qui a maggio, coraggio!\u003cbr>\nFai fuori quel che devi, dentro e fuori\u003cbr>\nla libertà è solo un miraggio,\u003cbr>\nancoraggio alla società,&nbsp;\u003cbr>\nappannaggio della nobiltà\u003cbr>\ndinamo delle vanità\u003c/div>\u003cdiv>il falò che innaffierò per 120 giornate.\u003c/div>\u003cdiv>Alternate.\u003cbr>Nudità. Nulliparità.&nbsp;\u003cbr>\n\u003cbr>\u003cbr>\u003cspan data-sacrisoft-style=\"1\" style=\"font-family: Inter, Arial, Helvetica, sans-serif;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 54px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 53px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 52px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 51px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 50px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 49px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 48px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 47px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 46px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 45px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 44px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 43px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 42px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 41px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 40px;\">\u003cspan data-sacrisoft-style data-sacrisoft-style=\"1\" style=\"font-size: 60px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 59px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 58px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 57px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 56px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 55px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 54px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 53px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 52px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 51px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 50px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 49px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 48px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 47px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 46px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 45px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 44px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 43px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 42px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 41px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 40px;\">AT MOre SPHERES\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>","html":"\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 32px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 33px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 34px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 35px;\">La forma cava\u003cbr>è oggi in Teoria Terra cava\u003cbr>e scava, scava, scava nell’immaginario\u003cbr>e questo troverai di ordinario,\u003cbr>lo straordinario.\u003cbr>Della e dalla terra cava\u003cbr>Platone raccontava\u003cbr>dell’illusoria realtà della caverna,\u003cbr>la realtà è una storia da taverna\u003cbr>al lume di lanterna\u003cbr>tra cocci di bottiglia, eterna galaverna.\u003cbr>Una volta cava\u003cbr>la terra custodiva lava\u003cbr>e va, va, va, andava\u003cbr>un po’ alla volta, si sollevava\u003cbr>ondivaga, ogivica, si oggettivava.\u003cbr>Una volta cava\u003cbr>cercava e cavalcava,\u003cbr>come una calotta cranica\u003cbr>la sua fisiognomica unica,\u003cbr>iconica,\u003cbr>più o meno fotogenica,\u003cbr>cronica,\u003cbr>una storia a cronaca\u003cbr>di un fiume carsico in Carnia, nel Carnico, ucronica.\u003cbr>Nell’iglù anche un hotel fuorilegge\u003cbr>dal ghiaccio protegge\u003cbr>un gruppo che in gregge\u003cbr>fuor di sé legge\u003cbr>schegge\u003cbr>estratte da un buco con pulegge\u003cbr>e l’alcol regge\u003cbr>e il ghiaccio protegge\u003cbr>chi l’alcol regge\u003cbr>e da quel bar\u003cdiv>si vede\u003cbr>una pulsar\u003cbr>e ode\u003cbr>un caterpillar passar.\u003cbr>Sulla neve tra i laghi si attorciglia\u003cbr>in perpetuo dormiveglia\u003cbr>sulla soglia\u003cbr>del vedo-non-vedo: è in vestaglia\u003cbr>la vestale ora mai sveglia,\u003cbr>era calda di conchiglia\u003cbr>l’interiora della terra nella faglia\u003cbr>che fu nel tufo\u003cbr>color tartufo\u003cbr>al cremor\u003cbr>tartaro e tremor\u003cbr>di foglia,\u003cbr>da tartagliar meraviglia,\u003cbr>tartar,\u003cbr>panicus timor\u003cbr>per i Terribili Tartari sotto Gengis Khan e sotto gengiva\u003cbr>sanguinosamente agiva\u003cbr>al di sotto degli Inferi, Ade,\u003cbr>Maria, Ave,\u003cbr>bianca come il tofu al bourbon di vaniglia,\u003cbr>reperto di grottaglia,\u003cbr>pavimento di graniglia.\u003cbr>Ha un foro romano come divino malocchio,\u003cbr>cassoni a spicchio,\u003cbr>che che sia, umore nero,\u003cbr>buco nero\u003cbr>o nero specchio,\u003cbr>il pantheon è molto vecchio,\u003cbr>oggi vanto, Vantablack, pantone invisibile all’occhio,\u003cbr>per tutti gli dei ideale panottico,\u003cbr>per sorvegliarci e punirci\u003cbr>(tutti,\u003cbr>belli, brutti,\u003cbr>per gli incel\u003cbr>\u003c/div>\u003cdiv>la redpill)\u003cbr>non serve la prigione per proteggerci\u003cbr>dalla società, alla sua mercé siam tutti merci\u003cbr>su meli marci,\u003cbr>lerci di commerci\u003cbr>come nei vangeli,\u003cbr>angeli,\u003cbr>sussurriamo arrivederci.\u003cbr>Histoire de la folie.\u003cbr>Histoire de l’œil.\u003cbr>Histoire d’O.\u003cbr>Foucault: l’apriori di Michel come di Jean Bernard Léon il pendolo.\u003cbr>Apeiron.\u003cbr>L’osservatorio astronomico scandisce il cielo,\u003cbr>offre rifugio nella notte del giorno e del gelo,\u003cbr>va oltre il velo\u003cbr>per trovare l’aggancio al pendolo\u003cbr>della matassa, il bandolo del dolo,\u003cbr>nel cosmo non c’è suolo\u003cbr>e nemmeno l’ombra del volo.\u003cbr>Una volta celeste\u003cbr>copre le alte creste\u003cbr>alle volte sulla crosta terrestre,\u003cbr>lasciate voi che entrate in quei crateri tutti i misteri\u003cbr>infittiti di chirotteri\u003cbr>e batterie di batteri,\u003cbr>una volta per tutte battuti strapoteri\u003cbr>di Batman e presbiteri,\u003cbr>nello spazio non è come in Star Trek, non esistono ministeri.\u003cbr>Alle alte atmosfere\u003cbr>non importa nulla, nemmeno le cose vere,\u003cbr>il mondo è grigio, il mondo è blu,\u003cbr>suscitano noncuranza perfino Bigfoot e Barbablù\u003cbr>che riuniti in quell’iglù\u003cbr>sognano vacanze uno a Cefalù,\u003cbr>l’altro a Tuvalu,\u003cbr>\u003c/div>\u003cdiv>il mondo fantastico è bello perché vario,\u003cbr>lo ama tanto il tipo solitario,\u003cbr>che d’inverno fa l’inventario ordinario\u003cbr>del suo immaginario straordinario.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>\u003cspan data-sacrisoft-style=\"1\" style=\"font-family: Inter, Arial, Helvetica, sans-serif;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-family: Inter, Arial, Helvetica, sans-serif;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 34px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 33px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 32px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 31px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 30px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 29px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 28px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 27px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 26px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 25px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 24px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 23px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 22px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 21px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 20px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 19px;\">\u003cspan data-sacrisoft-style=\"1\" style=\"font-size: 18px;\">©&nbsp;2026 Sara Ferro W.\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/div>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cdiv>\u003cbr>\u003c/div>","font":"Righteous","fontSize":31,"textColor":"#ffffff","bgColor":"#000000","image":"","overlay":0.3,"blur":0,"scrollTime":45,"video":"assets/AT_MOre_SPHERES.mp4"}];

let active=0;
let raf=null;

const q=s=>document.querySelector(s);
const site=q('#site');
const bg=q('#bg');
const bgimg=q('#bgimg');
const bgcolor=q('#bgcolor');
const ov=q('#ov');
const title=q('#title');
const copy=q('#copy');
const tabs=q('#tabs');
function show(i){
  active=i;

  const p=poems[i];

  bgcolor.style.background=p.bgColor||'#000000';

  if(p.image){
    bgimg.src=p.image;
    bgimg.style.display='block';
  }else{
    bgimg.removeAttribute('src');
    bgimg.style.display='none';
  }

  if(p.video){
    bg.src=p.video;
    bg.style.display='block';
    bg.load();
    bg.play().catch(()=>{});
  }else{
    bg.pause();
    bg.removeAttribute('src');
    bg.load();
    bg.style.display='none';
  }

  ov.style.background='rgba(0,0,0,'+p.overlay+')';
  const blur=Math.max(0,Math.min(30,+p.blur||0));
  const mediaFilter=blur ? 'blur('+blur+'px)' : 'none';
  bgimg.style.filter=mediaFilter;
  bgimg.style.webkitFilter=mediaFilter;
  bg.style.filter=mediaFilter;
  bg.style.webkitFilter=mediaFilter;
  ov.style.backdropFilter='none';
  ov.style.webkitBackdropFilter='none';

  title.innerHTML=p.titleHtml || p.title || 'Untitled Poetry';
  copy.innerHTML=p.html;

  const font=String(p.font||'Arial').trim()||'Arial';
  const size=Math.max(8,Math.min(120,+p.fontSize||31));

  const stack='"'+font.replace(/"/g,'')+'", Arial, Helvetica, sans-serif';
  title.style.fontFamily=stack;
  copy.style.fontFamily=stack;

  copy.style.fontSize=size+'px';
  title.style.fontSize=Math.max(size*1.7,size+14)+'px';

  const textColor=p.textColor||'#ffffff';
  copy.style.color=textColor;
  title.style.color=textColor;

  site.scrollTop=0;

  [...tabs.children].forEach((b,j)=>{
    b.classList.toggle('active',j===i);
  });
}

poems.forEach((p,i)=>{
  const b=document.createElement('button');
  b.className='tab';
  b.textContent=p.title||('Poetry '+(i+1));
  b.onclick=()=>show(i);
  tabs.appendChild(b);
});

let autoState='idle';
let autoStart=0;
let autoFrom=0;
let autoTo=0;
let autoDuration=0;

function exportedIcon(name){
  if(name==='pause'){
    return '<svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';
  }
  return '<svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
}

function setAutoButton(state){
  autoState=state;
  const b=q('#auto');
  if(!b)return;

  if(state==='playing') b.innerHTML=exportedIcon('pause')+' Pause';
  else if(state==='paused') b.innerHTML=exportedIcon('play_arrow')+' Resume';
  else b.innerHTML=exportedIcon('play_arrow')+' Auto Scroll';
}

function advanceExportPlaylist(){
  if(active>=poems.length-1){
    raf=null;
    setAutoButton('idle');
    return;
  }

  show(active+1);
  site.scrollTop=0;

  // Wait for the next poetry to render before calculating its scroll height.
  requestAnimationFrame(()=>requestAnimationFrame(()=>startAuto(true)));
}

function startAuto(reset=true){
  cancelAnimationFrame(raf);

  if(reset) site.scrollTop=0;

  autoFrom=site.scrollTop;
  autoTo=Math.max(0,site.scrollHeight-site.clientHeight);

  if(autoTo<=autoFrom){
    setAutoButton('playing');
    raf=requestAnimationFrame(()=>advanceExportPlaylist());
    return;
  }

  const full=Math.max(1,autoTo);
  const remaining=autoTo-autoFrom;
  autoDuration=(poems[active].scrollTime||45)*1000*(remaining/full);
  autoStart=performance.now();
  setAutoButton('playing');

  function tick(n){
    if(autoState!=='playing') return;

    const t=Math.min(1,(n-autoStart)/autoDuration);
    site.scrollTop=autoFrom+(autoTo-autoFrom)*t;

    if(t<1) raf=requestAnimationFrame(tick);
    else{
      raf=null;
      advanceExportPlaylist();
    }
  }

  raf=requestAnimationFrame(tick);
}

const autoBtn=q('#auto');
if(autoBtn){
  autoBtn.onclick=()=>{
    if(autoState==='playing'){
      cancelAnimationFrame(raf);
      raf=null;
      setAutoButton('paused');
    }else if(autoState==='paused'){
      startAuto(false);
    }else{
      startAuto(true);
    }
  };
}

const topBtn=q('#top');
if(topBtn){
  topBtn.onclick=()=>{
    cancelAnimationFrame(raf);
    raf=null;
    site.scrollTop=0;
    setAutoButton('idle');
  };
}

show(0);
</script>
