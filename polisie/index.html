*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;overflow:hidden}
.site{height:100vh;overflow-y:auto;overflow-x:hidden;position:relative;background:#000}
.bgcolor{position:fixed;inset:0;z-index:0;background:#000}
.bgimg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;display:none}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:transparent;z-index:0;display:none}
.overlay{position:fixed;inset:0;z-index:1;pointer-events:none}
.tabs{
  position:sticky;top:0;z-index:9;display:flex;gap:8px;overflow-x:auto;padding:12px 16px;
  background:rgba(0,0,0,.72);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.13)
}
.tab{
  appearance:none;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);
  padding:9px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;font-weight:700
}
.tab.active{background:#fff;color:#000}
.stage{
  position:relative;z-index:3;min-height:100vh;display:flex;justify-content:center;
  padding:7vh max(6vw,28px) 18vh
}
.inner{width:100%}
.title{
  color:#fff;line-height:1.02;font-weight:800;
  letter-spacing:-.04em;margin:0 0 32px
}
.copy{
  width:100%;line-height:1.52;overflow-wrap:anywhere
}
.copy img{max-width:100%;height:auto}
.copy a{color:inherit;text-decoration:underline}
.controls{
  position:fixed;right:14px;bottom:14px;z-index:20;display:flex;gap:7px;opacity:.22;transition:.2s
}
.controls:hover{opacity:1}
.controls button{
  border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.5);
  color:white;border-radius:999px;padding:8px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px
}
.control-icon{
  width:18px;
  height:18px;
  display:block;
  flex:0 0 auto;
  fill:currentColor;
}
.controls .reset-round{
  width:38px;
  height:38px;
  min-width:38px;
  padding:0;
  border-radius:50%;
  justify-content:center;
}
.reset-icon{transform:rotate(-90deg)}

"1\" style=\"font-size: 47px;\"><span data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\"></span><span data-sacrisoft-style=\"1\" style=\"font-size: 46px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 45px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 44px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 43px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 42px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 41px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 40px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 39px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 38px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 37px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 36px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 35px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 34px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 33px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 32px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 31px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 30px;\"><span data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">Siamo ammessi solo alla festa cr</span><span style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">udele,</span><div><span data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">una di quelle con angosciose candele,<br>festa antica per il festoso fedele.<br>Quando la tradizione sostituisce la festività<br>senza possibilità di una nuova attualità,<br>si sente solo la necessità<br>e la diversità<br>della festa dei diversi,<span data-sacrisoft-style=\"1\" style=\"font-size: 32px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 33px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 34px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 35px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 36px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 37px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 38px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 39px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 40px;\"><br></span></span></span></span></span></span></span></span></span>per cui si cerca di commuoversi&nbsp;<br>per farne una festa nostra,&nbsp;<br>come nell’osservare una danza<br>e di udir la musica nessuna speranza,<br>o perché si è perso l’udito<br>o in assenza oggettiva di musica,<br>non solo quella classica<br>e il tutto suona inaudito<br>e si va come si va a una mostra.<br>Rimangono solo sforzi come miraggi,&nbsp;<br>spiritati allunaggi<br>privi di storicità&nbsp;<br>per la nostra non più festosa collettività<br>tanta malinconia, un tempo giocondità.<br>“Festa in negativo”<br>“forma in cavo”<br>“di ciò che era la festa”<br>“della vera festa”<br>in cui il dolore la gioia spodesta,<br>diceva Furio Jesi,<br>inventando della macchina mitologica gli arnesi.<br>Niente più Paese di Cuccagna,<br>feste medievali con loro magna magna,<br>niente più feste dei folli<br>piene di spiedi, piene di polli,<br>comune evasione dalla realtà,<br>orgiastica eversione della civiltà,<br>lo dicono Max Horkheimer e Theodor W. Adorno,<br>ma non Mircea Eliade con i suoi Miti dell’Eterno ritorno.<br>Per Charles Baudelaire e Tonio Kröger&nbsp;<br>rimane solo una domestica hamburger in un lager,<br>festa interiore,<br>in cui il colore ha un altro colore<br>in contrasto col folklore<br>(istante tra i selvaggi e i civili<br>mentre non sono né virtuosi né vili).<br>Interiorizzazione, masticazione, incorporazione,<br>di un tempo astorico la narrazione<br>del narrante,&nbsp;<br>che introietta della festa la colazione<br>a base di crudités, crudità&nbsp;<br>dell’unica possibile collettiva crudeltà<br>del festeggiante.<br>“Coincidenza tra tempo storico presente”<br>“e attualità immobile astorica”<br>(tolta la festa ancora vera del 18° e la sua retorica)<br>che è il punto dell’esistenza operante&nbsp;<br>dell’odierno benandante.<br>Le feste pacifiche dei selvaggi<br>osservate da estrosi etnografi nei loro estrosi viaggi<br>altrove diversi mascherati da uguali,<br>importanti son le parvenze,<br>di cui l’etnologo spia le movenze,<br>(è possibile spiare di nascosto solo quelli ineguali).<br>“I selvaggi in festa raggiungono la massima densità”<br>“della loro diversità”<br>che è l’acme dell’umanità<br>e là si ha la possibilità&nbsp;<br>di un’altra solidarietà.<br>Per Thorstein Veblen la festa è un’azione<br>dove ostentano gli agiati della nazione<br>spreco vistoso,<br>tutto deve esser costoso,<br>che sia il potlatch nella Guinea Papua&nbsp;<br>o il ballo della nobiltà di Capua.<br>I calendari sono diversi dagli orologi,<br>questo scoprono alcuni sociologi</span></div><div><span data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">con gran scroscio di elogi.<br>Per Walter Benjamin è rappresentazione<br>dello spezzare del continuum temporale,<br>è la Rivoluzione,<br>che è tempo festivo corale,<br>violento temporale.<br>Dopo l’Illuminismo,<br>un nuovo deismo,<br>unica illuminazione<br>per tutti quelli dentro e fuori dalla patria prigione,<br>evviva le Feste della Dea Ragione<br>e dell’Essere Supremo, dannazione!<br>La Ragion di Stato<br>del borghese&nbsp;</span></div><div><span data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">sdogana la retorica dell'ultimo arrivato.<br>Per Elias Canetti è rilassamento<br>e concentrazione<br>di cose, beni e persone,<br>dove la sostanza coincide col momento<br>in cui le feste si richiamano l’altra l’una,<br>biglietto futuro per la prossima giostra della fortuna.<br>Eppur laboriosa,<br>labor labor labor<br>o non labor,<br>sì o no gioiosa,<br>sia che sia rifiuto del lavoro corruttore<br>sia celebrazione del dopo lavoro a tutte le ore.<br>Fatto sociale<br>totale,<br>è che la conoscibilità della festa nella società borghese&nbsp;<br>è per Jesi a farne le spese:<br>“non conosciamo le eventuali qualità positive&nbsp;</span></div><div><span data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">o negative di quelle feste”<br>“(che potevano anche essere nefaste)”<br>“ovvero la nostra non conoscenza della festa attuale”<br>“impedisce di dire se sia bene o male”<br>“dal punto di vista politico e sociale”.&nbsp;<br>Il germanista torinese&nbsp;<br>se per la festa la butta in Sangiovese&nbsp;<br>con fare comunque sinistrese<br>ne ha dette tante altre di pese<br>che ha appesantito il paese<br>(certa Intellettualitalia<br>ciuccia sempre da una cattiva balia).<br>Poteva continuare a far parlare le pietre<br>di cui aveva carpito segreti custoditi in segrete<br>o della ceramica greca dell’età tinita<br>su cui puoi passarci a studiare una vita.<br>Già con il saggio “Bachofen e la ginecocrazia”<br>pone le basi perché odi scientemente pure la zia</span></div><div><span data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">Aralda di burocrazia.</span></div><div><span data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">Summa summarum è sempre la stessa storia<br>della macchina mitologica,<br>la sua idiosincratica logica<br>con cui spiegare l’ideologizzazione<br>degli altri.&nbsp;<br>Sempre la stessa boria<br>reazionaria la sua<br>ossessione per la Nazione<br>degli scaltri.&nbsp;</span></div><div><span data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">Germanizzazione:<br>imputava<br>a quel che lui sentiva&nbsp;<br>avversario politico,<br>incursioni nel territorio mitico,&nbsp;<br>dove la mente arcaica<br>metteva ordine, gerarchia, origine sacra,<br>alla faccia della critica prosaica<br>che lui tanto ama mentre il resto esecra.<br>Cultura di Destra furiosa,<br>spartanamente manesca e maldestra è la chiosa,<br>violenta, nostalgica, sacrificale,<br>vede nel mito verità atemporale,<br>guida morale&nbsp;<br>Al Di Là Del Bene E Del Male,&nbsp;<br>A D L D B E D M -</span></div><div><span data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">la linea emme, tutto un bailamme,</span></div><div><span data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">Mazzini, Marx, Mao, Min, Marcuse,</span></div><div><span data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">serve un lanciafiamme o lanciargli le gemme,</span></div><div><span data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">(questi i concordi balordi di Blanciardi)</span></div><div><span data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">Mussolini non c'è ma porge le scuse,<br>cosa che da buon barbuto sbarbino,<br>l’enfant prodige,<br>bolla come perversità<br>(cherchez la femme,&nbsp;</span></div><div><span data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">che molto probabilmente non c'è,</span></div><div><span data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">di fatto lui era un proto-incel)<br>e nel suo Libro Nero tale redige<br>per far contento Gesù bambino.</span></div><div><span data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">Un cr.puntino.o è un cr.puntino.o &nbsp;</span></div><div><span data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\">è un cr.puntino.o è un cr.puntino.o.</span></div><div><span data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\"><br></span></div><div><span data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\"><br></span></div><div><span data-sacrisoft-style=\"1\" style=\"font-family: Rowdies, Arial, Helvetica, sans-serif;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 46px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 45px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 44px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 43px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 42px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 41px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 40px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 39px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 38px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 37px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 36px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 35px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 34px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 33px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 32px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 31px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 30px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 29px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 28px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 27px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 26px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 25px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 24px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 23px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 22px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 21px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 20px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 19px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 18px;\"><span data-sacrisoft-style=\"1\" style=\"font-family: Inter, Arial, Helvetica, sans-serif;\">©&nbsp;2026 Sara Ferro W.</span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span>< soft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\">Femme d’intérieur</span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span><div><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\"><span data-sacrisoft-style=\"1\">ovvero in Francia&nbsp;casalinga -&nbsp;</span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></div></span></span> t-size: 30px;\">o torto, nazionale aborto,</div><div style=\"font-size: 30px;\">sconfort, sconforto,</div><div style=\"font-size: 30px;\">escort d’asporto,</div><div style=\"font-size: 30px;\">ti tel con gran trasporto.<br>\nDegli INCEL dominatrice,<br>\nMedusa, Aretusa,<br>\nBeatrice ,<br>\nbela tosa.<br>\nImmune a Bela Lugosi.<br>\n“Amor e ’l cor gentil sono una cosa”.<br>\nDa Dalle a Della Casa,<br>\ndove mi calza a rete, 5G<br>\ntu le sais, mon monsieur,&nbsp;</div><div style=\"font-size: 30px;\">invaghito di vaghi mie pregi,<br>\n- a maglie larghe - di manica larga<br>\nsono e spalle strette da terga,</div><div style=\"font-size: 30px;\">da scarsa seconda di tette a seconda a nessuno,</div><div style=\"font-size: 30px;\">piedino feticcio che lavi in un catino</div><div style=\"font-size: 30px;\">pian piano<br>\nho tutta la giornata in mano<br>\nmanovro in casa la mia routine dal mattino.</div><div style=\"font-size: 30px;\">\nNon in Comune come una velata,<div>- l'Istituzione del Velo l'ha cooptata -,<br>\n<em>Italia di ‘sti Comuni</em>,<br>\ncon cui non ho (più) niente in comune,<br>\nin casa sfoglio la Blavatsky,&nbsp;</div><div>Isis svelata,<br>\nper esprimermi in rune</div><div>e farmi beata</div><div>sulla federa tre gocce di whisky.<br>\nLa mia solitudine interiore<br>\nè solipsismo verbale,&nbsp;</div><div>controriforma asociale,<br>\nabbasso il culturame,&nbsp;<br>\nin alto il verdurame&nbsp;</div><div>più cult e vero-speranza,&nbsp;<br>\ninterior design idiosincratico, demotico,&nbsp;<br>\nviva la robotica&nbsp;</div><div>a pulire il cielo della stanza<br>\nin casa sto bene, pecco d'arroganza</div><div>di cui ho noncuranza, vivo in latitanza</div><div>come altri in vacanza,</div><div>YouTuberomanza, ci tengo alla distanza,</div><div>vesto shorts d'organza,</div><div>non sono abbastanza</div><div>\nuna femmina liberata,&nbsp;<br>\nuna femminista imparata,<br>\nsono per voi troppo fatale,&nbsp;<br>\nper questo sto a casa, per non farvi male,&nbsp;<br>\nper non farmi male, sono d’intenso candore,<br>\nsto bene in casa a tutte le ore,&nbsp;</div><div>più amare, più ardore,<br>\nagli imperativi so stare</div><div>e sottostare&nbsp;</div><div>al mio imperatore,<br>\namo molto di più se non devo uscire<br>\nper l’aperitivo, dolce servire&nbsp;<br>\nil dolce stilnovo con l’uovo<br>\nsebbene non mi piaccia, preferisco il salato,&nbsp;<br>\nma volentieri ti servo il tuo gelato,<br>\nbagnato, con lingue di gatto, abolite dal ’68,<br>\nbollite!<br>\nSono d’interiori,&nbsp;<br>\nmi alzo e mi corico senza andare fuori<br>\n(forse mi perdo d’oggi forsennati furori),<br>fintanto alpeggio&nbsp;</div><div>nella mia malga, ho tanto di quel foraggio<br>\nche ti posso foraggiare da qui a maggio, coraggio!<br>\nFai fuori quel che devi, dentro e fuori<br>\nla libertà è solo un miraggio,<br>\nancoraggio alla società,&nbsp;<br>\nappannaggio della nobiltà<br>\ndinamo delle vanità</div><div>il falò che innaffierò per 120 giornate.</div><div>Alternate.<br>Nudità. Nulliparità.&nbsp;<br>\n<br><br><span data-sacrisoft-style=\"1\" style=\"font-family: Inter, Arial, Helvetica, sans-serif;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 54px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 53px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 52px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 51px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 50px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 49px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 48px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 47px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 46px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 45px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 44px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 43px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 42px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 41px;\"><span data-sacrisoft-style=\"1\ le=\"font-size: 78px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 79px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 80px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 79px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 78px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 77px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 76px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 75px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 74px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 73px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 72px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 71px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 70px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 69px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 68px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 67px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 66px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 65px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 64px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 63px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 62px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 61px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 60px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 59px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 58px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 57px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 56px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 55px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 54px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 53px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 52px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 51px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 50px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 49px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 48px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 47px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 46px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 45px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 44px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 43px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 42px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 41px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 40px;\">AT MOre SPHERES</span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span>","html":"<span data-sacrisoft-style=\"1\" style=\"font-size: 32px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 33px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 34px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 35px;\">La forma cava<br>è oggi in Teoria Terra cava<br>e scava, scava, scava nell’immaginario<br>e questo troverai di ordinario,<br>lo straordinario.<br>Della e dalla terra cava<br>Platone raccontava<br>dell’illusoria realtà della caverna,<br>la realtà è una storia da taverna<br>al lume di lanterna<br>tra cocci di bottiglia, eterna galaverna.<br>Una volta cava<br>la terra custodiva lava<br>e va, va, va, andava<br>un po’ alla volta, si sollevava<br>ondivaga, ogivica, si oggettivava.<br>Una volta cava<br>cercava e cavalcava,<br>come una calotta cranica<br>la sua fisiognomica unica,<br>iconica,<br>più o meno fotogenica,<br>cronica,<br>una storia a cronaca<br>di un fiume carsico in Carnia, nel Carnico, ucronica.<br>Nell’iglù anche un hotel fuorilegge<br>dal ghiaccio protegge<br>un gruppo che in gregge<br>fuor di sé legge<br>schegge<br>estratte da un buco con pulegge<br>e l’alcol regge<br>e il ghiaccio protegge<br>chi l’alcol regge<br>e da quel bar<div>si vede<br>una pulsar<br>e ode<br>un caterpillar passar.<br>Sulla neve tra i laghi si attorciglia<br>in perpetuo dormiveglia<br>sulla soglia<br>del vedo-non-vedo: è in vestaglia<br>la vestale ora mai sveglia,<br>era calda di conchiglia<br>l’interiora della terra nella faglia<br>che fu nel tufo<br>color tartufo<br>al cremor<br>tartaro e tremor<br>di foglia,<br>da tartagliar meraviglia,<br>tartar,<br>panicus timor<br>per i Terribili Tartari sotto Gengis Khan e sotto gengiva<br>sanguinosamente agiva<br>al di sotto degli Inferi, Ade,<br>Maria, Ave,<br>bianca come il tofu al bourbon di vaniglia,<br>reperto di grottaglia,<br>pavimento di graniglia.<br>Ha un foro romano come divino malocchio,<br>cassoni a spicchio,<br>che che sia, umore nero,<br>buco nero<br>o nero specchio,<br>il pantheon è molto vecchio,<br>oggi vanto, Vantablack, pantone invisibile all’occhio,<br>per tutti gli dei ideale panottico,<br>per sorvegliarci e punirci<br>(tutti,<br>belli, brutti,<br>per gli incel<br></div><div>la redpill)<br>non serve la prigione per proteggerci<br>dalla società, alla sua mercé siam tutti merci<br>su meli marci,<br>lerci di commerci<br>come nei vangeli,<br>angeli,<br>sussurriamo arrivederci.<br>Histoire de la folie.<br>Histoire de l’œil.<br>Histoire d’O.<br>Foucault: l’apriori di Michel come di Jean Bernard Léon il pendolo.<br>Apeiron.<br>L’osservatorio astronomico scandisce il cielo,<br>offre rifugio nella notte del giorno e del gelo,<br>va oltre il velo<br>per trovare l’aggancio al pendolo<br>della matassa, il bandolo del dolo,<br>nel cosmo non c’è suolo<br>e nemmeno l’ombra del volo.<br>Una volta celeste<br>copre le alte creste<br>alle volte sulla crosta terrestre,<br>lasciate voi che entrate in quei crateri tutti i misteri<br>infittiti di chirotteri<br>e batterie di batteri,<br>una volta per tutte battuti strapoteri<br>di Batman e presbiteri,<br>nello spazio non è come in Star Trek, non esistono ministeri.<br>Alle alte atmosfere<br>non importa nulla, nemmeno le cose vere,<br>il mondo è grigio, il mondo è blu,<br>suscitano noncuranza perfino Bigfoot e Barbablù<br>che riuniti in quell’iglù<br>sognano vacanze uno a Cefalù,<br>l’altro a Tuvalu,<br></div><div>il mondo fantastico è bello perché vario,<br>lo ama tanto il tipo solitario,<br>che d’inverno fa l’inventario ordinario<br>del suo immaginario straordinario.</div><div><br></div><div><br></div><div><span data-sacrisoft-style=\"1\" style=\"font-family: Inter, Arial, Helvetica, sans-serif;\"><span data-sacrisoft-style=\"1\" style=\"font-family: Inter, Arial, Helvetica, sans-serif;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 34px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 33px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 32px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 31px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 30px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 29px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 28px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 27px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 26px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 25px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 24px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 23px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 22px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 21px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 20px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 19px;\"><span data-sacrisoft-style=\"1\" style=\"font-size: 18px;\">©&nbsp;2026 Sara Ferro W.</span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></div></span></span></span></span><div><br></div>","font":"Righteous","fontSize":31,"textColor":"#ffffff","bgColor":"#000000","image":"","overlay":0.3,"blur":0,"scrollTime":45,"video":"assets/AT_MOre_SPHERES.mp4"}];

let active=0;
let raf=null;

const q=s=>document.querySelector(s);
const site=q('#site');
const bg=q('#bg');
const bgimg=q('#bgimg');
const bgcolor=q('#bgcolor');
const ov=q('#ov');
const title=q('#title');
const copy=q('#copy');
const tabs=q('#tabs');
function show(i){
  active=i;

  const p=poems[i];

  bgcolor.style.background=p.bgColor||'#000000';

  if(p.image){
    bgimg.src=p.image;
    bgimg.style.display='block';
  }else{
    bgimg.removeAttribute('src');
    bgimg.style.display='none';
  }

  if(p.video){
    bg.src=p.video;
    bg.style.display='block';
    bg.load();
    bg.play().catch(()=>{});
  }else{
    bg.pause();
    bg.removeAttribute('src');
    bg.load();
    bg.style.display='none';
  }

  ov.style.background='rgba(0,0,0,'+p.overlay+')';
  const blur=Math.max(0,Math.min(30,+p.blur||0));
  const mediaFilter=blur ? 'blur('+blur+'px)' : 'none';
  bgimg.style.filter=mediaFilter;
  bgimg.style.webkitFilter=mediaFilter;
  bg.style.filter=mediaFilter;
  bg.style.webkitFilter=mediaFilter;
  ov.style.backdropFilter='none';
  ov.style.webkitBackdropFilter='none';

  title.innerHTML=p.titleHtml || p.title || 'Untitled Poetry';
  copy.innerHTML=p.html;

  const font=String(p.font||'Arial').trim()||'Arial';
  const size=Math.max(8,Math.min(120,+p.fontSize||31));

  const stack='"'+font.replace(/"/g,'')+'", Arial, Helvetica, sans-serif';
  title.style.fontFamily=stack;
  copy.style.fontFamily=stack;

  copy.style.fontSize=size+'px';
  title.style.fontSize=Math.max(size*1.7,size+14)+'px';

  const textColor=p.textColor||'#ffffff';
  copy.style.color=textColor;
  title.style.color=textColor;

  site.scrollTop=0;

  [...tabs.children].forEach((b,j)=>{
    b.classList.toggle('active',j===i);
  });
}

poems.forEach((p,i)=>{
  const b=document.createElement('button');
  b.className='tab';
  b.textContent=p.title||('Poetry '+(i+1));
  b.onclick=()=>show(i);
  tabs.appendChild(b);
});

let autoState='idle';
let autoStart=0;
let autoFrom=0;
let autoTo=0;
let autoDuration=0;

function exportedIcon(name){
  if(name==='pause'){
    return '<svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';
  }
  return '<svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
}

function setAutoButton(state){
  autoState=state;
  const b=q('#auto');
  if(!b)return;

  if(state==='playing') b.innerHTML=exportedIcon('pause')+' Pause';
  else if(state==='paused') b.innerHTML=exportedIcon('play_arrow')+' Resume';
  else b.innerHTML=exportedIcon('play_arrow')+' Auto Scroll';
}

function advanceExportPlaylist(){
  if(active>=poems.length-1){
    raf=null;
    setAutoButton('idle');
    return;
  }

  show(active+1);
  site.scrollTop=0;

  // Wait for the next poetry to render before calculating its scroll height.
  requestAnimationFrame(()=>requestAnimationFrame(()=>startAuto(true)));
}

function startAuto(reset=true){
  cancelAnimationFrame(raf);

  if(reset) site.scrollTop=0;

  autoFrom=site.scrollTop;
  autoTo=Math.max(0,site.scrollHeight-site.clientHeight);

  if(autoTo<=autoFrom){
    setAutoButton('playing');
    raf=requestAnimationFrame(()=>advanceExportPlaylist());
    return;
  }

  const full=Math.max(1,autoTo);
  const remaining=autoTo-autoFrom;
  autoDuration=(poems[active].scrollTime||45)*1000*(remaining/full);
  autoStart=performance.now();
  setAutoButton('playing');

  function tick(n){
    if(autoState!=='playing') return;

    const t=Math.min(1,(n-autoStart)/autoDuration);
    site.scrollTop=autoFrom+(autoTo-autoFrom)*t;

    if(t<1) raf=requestAnimationFrame(tick);
    else{
      raf=null;
      advanceExportPlaylist();
    }
  }

  raf=requestAnimationFrame(tick);
}

const autoBtn=q('#auto');
if(autoBtn){
  autoBtn.onclick=()=>{
    if(autoState==='playing'){
      cancelAnimationFrame(raf);
      raf=null;
      setAutoButton('paused');
    }else if(autoState==='paused'){
      startAuto(false);
    }else{
      startAuto(true);
    }
  };
}

const topBtn=q('#top');
if(topBtn){
  topBtn.onclick=()=>{
    cancelAnimationFrame(raf);
    raf=null;
    site.scrollTop=0;
    setAutoButton('idle');
  };
}

show(0);
</script>
